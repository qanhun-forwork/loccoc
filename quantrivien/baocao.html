<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>Báo cáo cuối kỳ | Lộc Cộc</title>
<meta name="theme-color" content="#800E13">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23800E13'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* Báo cáo cuối kỳ Truyền thông số: slide HTML lấy số từ chính dashboard quản trị (cùng API, cùng token đăng nhập).
   Số trên slide đọc từ bản "đã chốt" (tab ẩn 📌 Chốt số liệu) để khớp với PDF đã nộp; nút "Số trực tiếp" chỉ để xem trước. */
:root{--be:#E8DCC8;--be-l:#F3EBDD;--be-xl:#FAF6EF;--be-d:#D8C7AA;--red:#800E13;--red-d:#5E0A0E;--nau:#5A3E32;--nau-d:#3E2A21;
 --ink:#1E130F;--tan:#B08A5E;--sans:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
 /* chữ trên nền tối kính mờ: chỉ dùng sắc nhạt của Be / Đỏ / Nâu */
 --chu:#FAF6EF;--chu2:rgba(250,246,239,.78);--mute:rgba(250,246,239,.58);--hl:#E7A9A3;--line:rgba(250,246,239,.14);
 --kinh:rgba(255,248,240,.07);--kinh2:rgba(255,248,240,.15);--vien:rgba(255,248,240,.22);--ria:rgba(255,255,255,.55);
 --h1a:#FFFFFF;--h1b:#E8DCC8;--nhay:#FFE9D6;
 --mo:blur(30px) saturate(180%);--em:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box}
html,body{margin:0}
body{font:15px/1.5 var(--sans);color:var(--chu);background:#140C09;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--hl)}
:focus-visible{outline:2px solid var(--hl);outline-offset:2px}
@property --p{syntax:"<number>";inherits:true;initial-value:0}

/* nền trang: mảng màu loang trôi chậm phía sau sân khấu */
.nen{position:fixed;inset:-20%;z-index:-1;filter:blur(90px);opacity:.55;pointer-events:none;
 background:radial-gradient(40% 35% at 20% 25%,#800E13,transparent 70%),radial-gradient(35% 40% at 80% 70%,#5A3E32,transparent 70%),radial-gradient(30% 30% at 70% 15%,#B08A5E,transparent 70%);
 animation:troi 28s ease-in-out infinite alternate}
@keyframes troi{to{transform:translate3d(4%,-3%,0) rotate(8deg) scale(1.08)}}

/* thanh điều khiển: viên kính nổi kiểu iOS */
.thanh{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:5;display:flex;gap:4px;align-items:center;padding:5px;max-width:calc(100% - 24px);overflow-x:auto;
 background:rgba(40,24,18,.5);backdrop-filter:var(--mo);-webkit-backdrop-filter:var(--mo);border:1px solid var(--vien);border-radius:999px;
 box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 18px 40px -18px rgba(0,0,0,.7);scrollbar-width:none}
.thanh b{font-weight:800;padding:0 10px 0 12px;white-space:nowrap;letter-spacing:-.01em}
.thanh button,.thanh a{border:0;background:transparent;border-radius:999px;padding:8px 14px;color:var(--chu2);text-decoration:none;font-size:13px;font-weight:600;white-space:nowrap;transition:background .25s,color .25s,transform .2s}
.thanh button:hover,.thanh a:hover{background:rgba(255,248,240,.12);color:var(--chu)}
.thanh button:active{transform:scale(.96)}
.thanh button.chinh{background:linear-gradient(180deg,#9A1A20,#800E13);color:var(--chu);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.thanh button[aria-pressed=true]{background:rgba(255,248,240,.92);color:var(--ink);box-shadow:0 4px 14px -6px rgba(0,0,0,.5)}
.thanh .gach{width:1px;height:20px;background:var(--line);flex:none}
.song{display:none;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--chu2);padding:0 10px;white-space:nowrap;cursor:pointer}
body.dang-song .song{display:flex}
.song i{width:8px;height:8px;border-radius:50%;background:#E7A9A3;box-shadow:0 0 0 0 rgba(231,169,163,.7);animation:mach 2s infinite}
.song.dung i{animation:none;background:var(--mute)}
@keyframes mach{70%{box-shadow:0 0 0 8px rgba(231,169,163,0)}100%{box-shadow:0 0 0 0 rgba(231,169,163,0)}}
#tt{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);font-size:12px;color:var(--mute);white-space:nowrap;z-index:4}
body.chieu .thanh,body.chieu #tt,body.chieu #dem,body.chieu .tien-do{opacity:0;pointer-events:none;transition:opacity .3s}
body.chieu .thanh:hover{opacity:1;pointer-events:auto}

/* sân khấu: mỗi slide 1280×720, co giãn theo màn hình */
#san{min-height:100dvh;display:grid;place-items:center;padding:72px 0 40px}
body.chieu #san{padding:0}
.khung{width:calc(1280px*var(--k,1));height:calc(720px*var(--k,1));position:relative;border-radius:calc(28px*var(--k,1));
 box-shadow:0 50px 120px -40px rgba(0,0,0,.85),0 0 0 1px var(--vien)}
body.chieu .khung{border-radius:0;box-shadow:none}
/* thanh tiến độ dưới khung */
.tien-do{position:absolute;z-index:3;left:calc(28px*var(--k,1));right:calc(28px*var(--k,1));bottom:-14px;height:3px;border-radius:3px;background:rgba(255,248,240,.1);overflow:hidden}
.tien-do i{display:block;height:100%;width:var(--w,0%);background:linear-gradient(90deg,#9A1A20,#E7A9A3);border-radius:3px;transition:width .6s var(--em)}

.sl{position:absolute;inset:0 auto auto 0;width:1280px;height:720px;transform:scale(var(--k,1));transform-origin:0 0;border-radius:28px;
 overflow:hidden;display:none;padding:50px 60px 54px;flex-direction:column;isolation:isolate;color:var(--chu);
 background:radial-gradient(60% 70% at 0% 0%,#6E0C11 0%,transparent 60%),radial-gradient(55% 60% at 100% 100%,#4A3229 0%,transparent 65%),linear-gradient(135deg,#2B1712,#1A100C)}
body.chieu .sl{border-radius:0}
/* hai đốm màu mờ trôi chậm phía sau để lớp kính có thứ để làm nhoè */
.sl::before,.sl::after{content:"";position:absolute;z-index:-1;border-radius:50%;filter:blur(70px);animation:dom 18s ease-in-out infinite alternate}
.sl::before{width:520px;height:520px;right:-120px;top:-160px;background:radial-gradient(circle,rgba(176,138,94,.75),transparent 70%)}
.sl::after{width:620px;height:420px;left:18%;bottom:-220px;background:radial-gradient(circle,rgba(154,26,32,.85),transparent 70%);animation-duration:24s;animation-direction:alternate-reverse}
.sl:nth-child(3n+2)::before{background:radial-gradient(circle,rgba(154,26,32,.8),transparent 70%);right:auto;left:-160px}
.sl:nth-child(3n)::after{background:radial-gradient(circle,rgba(216,199,170,.45),transparent 70%)}
@keyframes dom{to{transform:translate3d(-60px,40px,0) scale(1.15)}}
.sl.on{display:flex}
/* vào slide: cả trang trượt theo hướng bấm, các thẻ hiện lần lượt */
.sl.on.vao{animation:vao .6s var(--em)}
@keyframes vao{from{opacity:0;filter:blur(10px);transform:scale(var(--k,1)) translateX(calc(var(--huong,1)*36px))}}
.sl.vao .phan,.sl.vao h1,.sl.vao .mo-ta{animation:len .7s var(--em) both}
.sl.vao h1{animation-delay:.06s}.sl.vao .mo-ta{animation-delay:.12s}
.sl.vao .noi>*{animation:len .75s var(--em) both}
.sl.vao .noi>:nth-child(1){animation-delay:.14s}.sl.vao .noi>:nth-child(2){animation-delay:.22s}.sl.vao .noi>:nth-child(3){animation-delay:.3s}
.sl.vao .noi>:nth-child(4){animation-delay:.38s}.sl.vao .noi>:nth-child(5){animation-delay:.46s}.sl.vao .noi>:nth-child(n+6){animation-delay:.52s}
@keyframes len{from{opacity:0;transform:translateY(18px) scale(.985)}}
.so-trang{position:absolute;right:60px;bottom:22px;font-size:12px;color:var(--mute);letter-spacing:.12em;font-weight:700}
.chan{position:absolute;left:60px;bottom:22px;font-size:12px;color:var(--mute);letter-spacing:.06em}
#dem{position:fixed;right:18px;bottom:12px;color:var(--mute);font-size:12px;font-weight:600}

/* chữ: tiêu đề cân dòng, không để một chữ rơi xuống dòng riêng */
.phan{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--chu2);margin:0 0 14px;display:flex;gap:10px;align-items:center;flex:none}
.phan i{font-style:normal;background:var(--kinh2);border:1px solid var(--vien);color:var(--chu);border-radius:999px;padding:3px 11px;letter-spacing:.06em;backdrop-filter:var(--mo);-webkit-backdrop-filter:var(--mo)}
.phan s{text-decoration:none;color:var(--mute);font-weight:700;margin-left:auto;letter-spacing:.12em;border:1px solid var(--line);border-radius:999px;padding:3px 10px}
/* padding dưới để dấu tiếng Việt (ạ, ặ, ỵ…) không bị cắt khi tô chữ bằng gradient */
h1{font-size:38px;line-height:1.18;font-weight:800;letter-spacing:-.022em;margin:0 0 22px;padding:.06em 0 .1em;max-width:1140px;flex:none;text-wrap:balance;
 background:linear-gradient(180deg,var(--h1a) 15%,var(--h1b));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:12px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--chu2);margin:0 0 12px;line-height:1.4}
p{margin:0 0 10px;text-wrap:pretty}
.nho{font-size:12.5px;color:var(--mute)}
.dat,.chua{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;letter-spacing:.02em;white-space:nowrap}
.dat{background:rgba(250,246,239,.92);color:var(--ink)}
.chua{background:rgba(154,26,32,.85);color:#FAF6EF;box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}

/* bố cục + thẻ kính lỏng: viền sáng chạy theo góc, ánh sáng quét qua khi vào slide */
.noi{flex:1;display:grid;gap:18px;min-height:0;grid-auto-rows:minmax(0,1fr)}
.noi.tu{grid-auto-rows:auto;align-content:start}
.c2{grid-template-columns:1fr 1fr}.c3{grid-template-columns:repeat(3,1fr)}.c4{grid-template-columns:repeat(4,1fr)}
.c52{grid-template-columns:1.25fr 1fr}.c25{grid-template-columns:1fr 1.25fr}
.o{position:relative;background:linear-gradient(160deg,var(--kinh2),var(--kinh) 65%);backdrop-filter:var(--mo);-webkit-backdrop-filter:var(--mo);
 border-radius:24px;padding:20px 22px;min-height:0;min-width:0;display:flex;flex-direction:column;overflow:hidden;
 box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 24px 50px -28px rgba(0,0,0,.7)}
.o::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
 background:linear-gradient(140deg,var(--ria),rgba(255,255,255,.04) 38%,rgba(255,255,255,.04) 62%,rgba(255,255,255,.3));
 -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
/* ánh sáng quét: nằm gọn trong thẻ (inset:0) để không làm sai phép đo tràn chữ */
.o::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;
 background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.16) 50%,transparent 62%) no-repeat;background-size:260% 100%}
.sl.vao .o::after{animation:quet 1.6s .5s var(--em)}
@keyframes quet{0%{opacity:1;background-position:120% 0}100%{opacity:0;background-position:-20% 0}}
.o>*{position:relative}
.o{color:var(--chu)}
.o.toi{background:linear-gradient(160deg,rgba(154,26,32,.6),rgba(94,10,14,.35))}
.so{font-size:50px;font-weight:800;letter-spacing:-.035em;line-height:1.05;color:var(--chu);white-space:nowrap}
.so small{font-size:18px;color:var(--mute);font-weight:600;letter-spacing:0}
.bang{width:100%;border-collapse:collapse;font-size:14.5px;line-height:1.4}
.bang th{text-align:left;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);font-weight:700;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:bottom}
.bang td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--chu);overflow-wrap:anywhere}
.bang td:first-child,.bang th:first-child{padding-left:0}
.pdca td:first-child{white-space:nowrap;width:1%;padding-right:16px}
.bang tr:last-child td{border-bottom:0}
.bang td.s{text-align:right;white-space:nowrap;overflow-wrap:normal}
.bang th.s{text-align:right}
.o.gon{padding:16px 20px}.o.gon h2{margin-bottom:6px}.o.gon p{margin-bottom:6px;font-size:14px}.o.gon .so{font-size:38px}
.nhan-dinh td{font-size:13.5px;line-height:1.45;color:var(--chu2)}
.nhan-dinh td b{color:var(--chu);font-weight:700}
.bd{position:relative;flex:1;min-height:0}
.bd canvas{position:absolute;inset:0;width:100%!important;height:100%!important}
.anh{flex:1;min-height:0;border-radius:16px;overflow:hidden;background:rgba(0,0,0,.2);border:1px solid var(--line)}
.anh img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.the-lk{display:flex;flex-direction:column;gap:6px}
.lk{font-size:16px;font-weight:700;color:var(--chu);margin:0}
.cat{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* thanh % đạt: chạy từ 0 khi vào slide */
.tien{display:block;height:6px;border-radius:6px;background:var(--line);margin-top:6px;overflow:hidden;min-width:70px}
.tien i{display:block;height:100%;width:calc(min(var(--p),1)*100%);border-radius:6px;background:linear-gradient(90deg,#B08A5E,#E7A9A3)}
.tien.du i{background:linear-gradient(90deg,#E8DCC8,#FAF6EF)}
.sl.vao .tien i{animation:day 1.2s .35s var(--em) both}
@keyframes day{from{width:0}}
/* vòng tròn tiến độ trên bìa */
.vong{--p:0;width:86px;height:86px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:15px;font-weight:800;
 background:radial-gradient(closest-side,rgba(43,23,18,.55) 76%,transparent 78% 100%),conic-gradient(#E7A9A3 calc(min(var(--p),1)*1turn),rgba(255,248,240,.14) 0)}
.sl.vao .vong{animation:vong 1.4s .3s var(--em) both}
@keyframes vong{from{--p:0}}
.chi-so{display:flex;gap:16px;align-items:center}

/* số đang chạy khi vừa cập nhật */
.dem{display:inline-block;transition:color .4s,text-shadow .4s}
.dem.nhay{color:var(--nhay);text-shadow:0 0 18px rgba(231,169,163,.9)}

/* dòng thời gian */
.moc{list-style:none;margin:0;padding:0 0 0 18px;position:relative;display:flex;flex-direction:column;gap:9px}
.moc::before{content:"";position:absolute;left:4px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--hl),transparent)}
.moc li{position:relative;font-size:14px;line-height:1.4;color:var(--chu2)}
.moc li::before{content:"";position:absolute;left:-18px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--hl);box-shadow:0 0 0 3px rgba(231,169,163,.2)}
.moc b{color:var(--chu);margin-right:6px}
.ds{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:7px}
.ds li{line-height:1.45}
.ds li::marker{color:var(--hl)}
.o.toi .ds li::marker{color:#E8DCC8;font-weight:700}
.lon{font-size:19px;line-height:1.45;font-weight:600;color:var(--chu)}

/* ghi chú cho nhóm: chỉ hiện trên màn hình, không in ra PDF */
.bs{border:1.5px dashed rgba(231,169,163,.6);border-radius:14px;padding:10px 14px;background:rgba(128,14,19,.18);color:var(--chu2);font-size:13px;margin-top:auto}
.bs b{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:2px;color:var(--hl)}
body.in .bs{display:none}

/* phễu */
.pheu{display:flex;flex-direction:column;gap:10px;align-items:center;flex:1;justify-content:center}
.tang{border-radius:20px;padding:16px 24px;display:flex;justify-content:space-between;align-items:baseline;gap:20px;border:1px solid rgba(255,248,240,.24);color:#FAF6EF;
 background:linear-gradient(135deg,rgba(154,26,32,.92),rgba(110,12,17,.8));box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 16px 30px -18px rgba(0,0,0,.8)}
.tang.t2{background:linear-gradient(135deg,rgba(122,88,70,.92),rgba(90,62,50,.85))}
.tang.t3{background:linear-gradient(135deg,rgba(201,162,126,.95),rgba(176,138,94,.88));color:var(--ink)}
.tang b{font-size:34px;font-weight:800;letter-spacing:-.02em}
.tang span{font-size:14px;opacity:.9}
.sl.vao .tang{animation:len .7s var(--em) both}.sl.vao .tang.t2{animation-delay:.25s}.sl.vao .tang.t3{animation-delay:.4s}
.mui{font-size:12px;color:var(--mute);font-weight:600}

/* bìa */
.bia{padding:64px;background:radial-gradient(70% 80% at 10% 10%,#9A1A20,transparent 60%),radial-gradient(60% 70% at 100% 100%,#5A3E32,transparent 65%),linear-gradient(135deg,#5E0A0E,#2B1712)}
.bia h1{font-size:58px;max-width:1000px;line-height:1.08}
.bia .so{font-size:46px}
.mo-ta{font-size:18px;max-width:920px;color:var(--chu2)}

/* slide sáng: nền be kính sữa, xen kẽ với slide tối cho đỡ đơn điệu */
.sl.sang{--chu:#2B1712;--chu2:rgba(43,23,18,.78);--mute:rgba(62,42,33,.62);--hl:#800E13;--line:rgba(90,62,50,.16);
 --kinh:rgba(255,255,255,.38);--kinh2:rgba(255,255,255,.72);--vien:rgba(255,255,255,.85);--ria:rgba(255,255,255,1);
 --h1a:#3E2A21;--h1b:#800E13;--nhay:#800E13;
 background:radial-gradient(60% 70% at 0% 0%,#FAF6EF 0%,transparent 60%),radial-gradient(55% 60% at 100% 100%,#D8C7AA 0%,transparent 65%),linear-gradient(135deg,#F3EBDD,#E8DCC8)}
.sl.sang::before{background:radial-gradient(circle,rgba(154,26,32,.32),transparent 70%)}
.sl.sang::after{background:radial-gradient(circle,rgba(176,138,94,.55),transparent 70%)}
.sl.sang .o{box-shadow:inset 0 1px 0 #fff,0 24px 50px -30px rgba(90,62,50,.45)}
.sl.sang .o.toi{background:linear-gradient(160deg,#9A1A20,#800E13);--chu:#FAF6EF;--chu2:rgba(250,246,239,.85);--mute:rgba(250,246,239,.7)}
.sl.sang .dat{background:#2B1712;color:#FAF6EF}
.sl.sang .tien.du i{background:linear-gradient(90deg,#5A3E32,#2B1712)}
.sl.sang .tien i{background:linear-gradient(90deg,#B08A5E,#800E13)}
.sl.sang .bs{background:rgba(128,14,19,.06);border-color:rgba(128,14,19,.4)}
.sl.sang .moc li::before{box-shadow:0 0 0 3px rgba(128,14,19,.15)}

#loi{position:fixed;inset:0;display:none;place-items:center;background:#1A100C;z-index:9;padding:24px;text-align:center}
#loi.on{display:grid}
#loi div{max-width:460px}

@media print{
 @page{size:1280px 720px;margin:0}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact;animation:none!important}
 body{background:#1A100C}
 .thanh,#dem,#loi,#tt,.nen,.tien-do{display:none!important}
 #san{display:block;padding:0}
 .khung{width:auto;height:auto;box-shadow:none;border-radius:0}
 .sl{display:flex!important;position:relative;transform:none;border-radius:0;page-break-after:always;break-after:page}
 /* in PDF không làm nhoè được: thay kính mờ bằng lớp phủ đặc hơn */
 .o,.phan i{backdrop-filter:none;-webkit-backdrop-filter:none}
 .o{background:linear-gradient(160deg,rgba(255,248,240,.16),rgba(255,248,240,.09))}
 .sl.sang .o{background:linear-gradient(160deg,rgba(255,255,255,.8),rgba(255,255,255,.55))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="nen" aria-hidden="true"></div>
<div class="thanh">
 <b>Lộc Cộc · Báo cáo</b>
 <button id="n-chot" aria-pressed="true">Số đã chốt</button>

<script>
/* Cùng địa chỉ Apps Script với website và trang quản trị. Đổi một chỗ thì đổi cả ba. */
var API="https://script.google.com/macros/s/AKfycbzc2ftUntEyk5PQMaHxldWdDqk0LdH39U8qiY_ZoMe3HiDYQ2vSo_1d4jHRHc7J6VLUCg/exec";
var token="";try{token=sessionStorage.getItem("qt_tk")||""}catch(x){}
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function soTho(n){return Math.round(Number(n||0)).toLocaleString("vi-VN")}
function ptTho(n){return (Math.round(n*1000)/10).toLocaleString("vi-VN")+"%"}
// so()/pt() bọc số trong span.dem để khi cập nhật nền số chạy từ giá trị cũ sang giá trị mới
function so(n){n=Number(n||0);return '<span class="dem" data-v="'+n+'" data-f="so">'+soTho(n)+'</span>'}
function pt(n){n=Number(n||0);return '<span class="dem" data-v="'+n+'" data-f="pt">'+ptTho(n)+'</span>'}
function ngay(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function nhan(t){return t.slice(8,10)+"/"+t.slice(5,7)}
function gioVN(iso){var d=new Date(iso);return isNaN(d)?"":d.toLocaleString("vi-VN",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"})}
function cong(t,n){var d=new Date(t+"T00:00:00");d.setDate(d.getDate()+n);return ngay(d)}
function goi(hanh,du){
 return fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({hanh:hanh,token:token},du||{}))})
  .then(function(r){return r.json()}).then(function(j){if(j.hetPhien){$("loi").classList.add("on");throw new Error(j.loi)}if(!j.ok)throw new Error(j.loi||"Có lỗi xảy ra.");return j})}

/* ═════════ Tính số từ dữ liệu dashboard → bản tổng hợp S (đây là thứ được chốt) ═════════ */
function tinh(mx,xem,vc,tq,den,vcTruoc){
 var tuan=[];for(var t=BAT_DAU,i=1;t<=den;t=cong(t,7),i++)tuan.push({i:i,tu:t,den:cong(t,6)<den?cong(t,6):den});
 var tong=function(D,f,tu,dn){var s=0;Object.keys(D.ngay||{}).forEach(function(n){if(n>=(tu||BAT_DAU)&&n<=(dn||den))s+=D.ngay[n][f]||0});return s};
 var folNay={fb:(mx.meta.hienTai||{}).fb||0,ig:(mx.meta.hienTai||{}).ig||0,tt:(mx.ttApi.hienTai||{}).fol||0};
 var K={};
 ["fb","ig","tt"].forEach(function(p){var D=mx[p],tt=function(a,b){return p==="tt"?tong(D,"thich",a,b)+tong(D,"bl",a,b)+tong(D,"cs",a,b):tong(D,"tt",a,b)};
  var x=tong(D,"xem"),tu=tt();
  K[p]={fol:folNay[p],xem:x,tuongTac:tu,er:x?tu/x:0,nguoi:tong(D,"nguoi"),clk:tong(D,"clk"),moi:tong(D,"moi"),cs:tong(D,"cs"),hs:tong(D,"hs"),
   tuan:tuan.map(function(w){return {xem:tong(D,"xem",w.tu,w.den),fol:folNay[p]-tong(D,"moi",cong(w.den,1),den)}})}});
 // TikTok: tần suất đăng tính từ danh sách video (API chỉ trả video, không có bài ảnh cuộn)
 var vid=(mx.ttApi.video||[]).filter(function(v){return v.ngay>=BAT_DAU&&v.ngay<=den});
 K.tt.video=vid.map(function(v){var t=v.thich+v.binhLuan+v.chiaSe;return {ten:v.tieuDe,ngay:v.ngay,xem:v.xem,tt:t,er:v.xem?t/v.xem:0,cs:v.chiaSe,link:v.link}}).sort(function(a,b){return b.xem-a.xem});
 K.tt.baiTuan=tuan.map(function(w){return vid.filter(function(v){return v.ngay>=w.tu&&v.ngay<=w.den}).length});
 // FB/IG: danh sách bài từ Graph API (tab ẩn 📝 Bài đăng, Apps Script ≥ 4.11); chưa có thì để null
 var bd=(mx.baiDang||[]).filter(function(b){return b.ngay>=BAT_DAU&&b.ngay<=den});
 ["fb","ig"].forEach(function(p){var ds=bd.filter(function(b){return b.kenh===p});K[p].baiTuan=ds.length?tuan.map(function(w){return ds.filter(function(b){return b.ngay>=w.tu&&b.ngay<=w.den}).length}):null;
  // 3 bài nhiều thích + bình luận nhất (Graph API không trả số thích bài Fanpage nên chỉ IG có số)
  K[p].top=ds.filter(function(b){return b.thich+b.bl>0}).sort(function(a,b){return (b.thich+b.bl)-(a.thich+a.bl)}).slice(0,3).map(function(b){return {ten:b.tieuDe,ngay:b.ngay,loai:b.loai,tt:b.thich+b.bl,link:b.link}})});
 // landing page: phiên có nguồn (mạng xã hội, link giới thiệu, UTM) = truy cập từ bên ngoài; bỏ "Trực tiếp" (gồm lượt của nhóm)
 var ng=xem.nguon||{},ngoai=0;Object.keys(ng).forEach(function(k){if(k!=="Trực tiếp")ngoai+=ng[k]});
 // bộ đếm web chỉ có từ ngày đầu tiên trong tab 👁 Lượt xem (24/10): trước đó lấy khách có nguồn giới thiệu từ Vercel,
 // bỏ "(không rõ)" (truy cập trực tiếp) và lượt từ chính loccoc.com.vn / vercel.com
 var vt=(vcTruoc||{})["Nguồn"]||{},nguonVc={},ngoaiVc=0;
 Object.keys(vt).forEach(function(k){if(/^\(|loccoc\.com\.vn|vercel\.com/.test(k)||!vt[k].khach)return;nguonVc[k]=vt[k].khach;ngoaiVc+=vt[k].khach});
 // ô ngày giờ trong Sheet về trình duyệt dạng ISO giờ UTC (18/10 00:00 giờ VN = "2026-10-17T17:00Z") → đổi lại ngày theo giờ Việt Nam
 var trongKy=function(r){var d=new Date(r["Thời gian"]||r["Ngày"]);return isNaN(d)?"":d.toLocaleDateString("en-CA",{timeZone:"Asia/Ho_Chi_Minh"})};
 var don=(tq.don||[]).map(trongKy).filter(function(n){return n>=BAT_DAU&&n<=den}),lh=(tq.lh||[]).map(trongKy).filter(function(n){return n>=BAT_DAU&&n<=den});
 var form=don.concat(lh);
 var demNgay=function(ds,a,b){return ds.filter(function(n){return n>=a&&n<=b}).length};
 var vcTruocKhach=0;Object.keys(vc.ngay||{}).forEach(function(n){if(n>=BAT_DAU&&n<=den&&(!xem.dauTien||n<xem.dauTien))vcTruocKhach+=vc.ngay[n].khach||0});
 K.web={phien:xem.tong.phien+vcTruocKhach,vcTruocKhach:vcTruocKhach,khach:xem.tong.khach,xem:xem.tong.xem,thoat:xem.tong.thoat,ngoai:ngoai+ngoaiVc,ngoaiDem:ngoai,ngoaiVc:ngoaiVc,nguonVc:nguonVc,demTu:xem.dauTien||"",nguon:ng,vcKhach:vc.tong.khach,vcXem:vc.tong.xem,vcNguon:vc["Nguồn"]||{},
  don:don.length,lh:lh.length,don2Ngay:demNgay(don,"2026-10-18","2026-10-19"),donTruoc23:demNgay(don,BAT_DAU,"2026-10-22"),donSau23:demNgay(don,"2026-10-23",den),form:form.length,
  // trước ngày bộ đếm bắt đầu: lượt truy cập lấy số khách theo ngày của Vercel
  tuan:tuan.map(function(w){var p=0;Object.keys(xem.ngay||{}).forEach(function(n){if(n>=w.tu&&n<=w.den)p+=xem.ngay[n].phien});
   Object.keys(vc.ngay||{}).forEach(function(n){if(n>=w.tu&&n<=w.den&&(!xem.dauTien||n<xem.dauTien))p+=vc.ngay[n].khach||0});
   return {phien:p,form:form.filter(function(n){return n>=w.tu&&n<=w.den}).length}})};
 K.fb.tt6B=K.fb.tuongTac;
 K.ig.xem6B=K.ig.xem;
 // quảng cáo: số đơn gửi trong đúng thời gian chạy (lượt vào web từ Instagram gắn thêm ở taiSong)
 var qc=(mx.qcIg||[]).map(function(q){return Object.assign({},q,{don:/^\d{4}-\d{2}-\d{2}$/.test(q.tu)?demNgay(don,q.tu,q.den||q.tu):null})});
 return {luc:new Date().toISOString(),tu:BAT_DAU,den:den,tuan:tuan,k:K,qc:qc,
  nguonTT:"TikTok API + TikTok Studio",capNhat:{meta:mx.meta.luc,tt:mx.ttApi.luc,vc:vc.capNhat}};
}
function taiSong(){var den=ngay(new Date()),k={tu:BAT_DAU,den:den};
 return Promise.all([goi("mangXaHoi",k),goi("luotXem",k),goi("vercel",k),goi("tongQuan")]).then(function(r){var d=r[1].dauTien;
  return (d&&d>BAT_DAU?goi("vercel",{tu:BAT_DAU,den:cong(d,-1)}):Promise.resolve(null)).then(function(vt){return tinh(r[0],r[1],r[2],r[3],den,vt)})})
  // CPA quảng cáo IG không có Mã UTM (hành động = bấm link web): khách Vercel có nguồn instagram.com / l.instagram.com trong đúng ngày chạy;
  // quảng cáo có Mã UTM thì Apps Script đã đếm sẵn q.utmPhien từ bộ đếm web
  .then(function(S){return Promise.all(S.qc.map(function(q){if(q.don==null||q.utm)return null;
   return goi("vercel",{tu:q.tu,den:q.den||q.tu}).then(function(v){var N=v["Nguồn"]||{},kh=0,xm=0;
    Object.keys(N).forEach(function(k){if(/(^|\.)instagram\.com$/.test(k)){kh+=N[k].khach||0;xm+=N[k].xem||0}});q.igKhach=kh;q.igXem=xm})})).then(function(){return S})})}

var BIEU=[];
function ty(a,b){return b?a/b:0}
function dg(a,b){return a>=b?'<span class="dat">Đạt</span>':'<span class="chua">Chưa đạt</span>'}
function kq(a,b,kieu){return kieu==="pt"?pt(a)+" / "+pt(b):so(a)+" / "+so(b)}

function dong(ten,a,b,kieu,nguon){return '<tr><td>'+ten+(nguon?'<br><span class="nho">'+nguon+'</span>':'')+'</td><td class="s">'+kq(a,b,kieu)+'</td><td class="s">'+pt(ty(a,b))+tien(ty(a,b))+'</td><td class="s">'+dg(a,b)+'</td></tr>'}

 var kh=nhan(S.tu)+"–"+nhan(S.den);
 r+=dong("Người theo dõi",K.fol,m.fol,"","Từ 0 khi lập kênh");
 r+=dong("Lượt xem (Views)",K.xem,m.xem,"",kh);
 r+=dong("Tương tác ÷ lượt xem",K.er,m.er,"pt","("+so(K.tuongTac)+" ÷ "+so(K.xem)+")");
 var bt=K.baiTuan;
 if(bt){var dat=bt.filter(function(x){return x>=m.bai}).length;r+='<tr><td>Tần suất đăng (≥ 2 '+(p==="tt"?"video":"bài")+'/tuần)<br><span class="nho">Theo tuần: '+bt.join("-")+'</span></td><td class="s">'+dat+' / '+bt.length+' tuần</td><td class="s">'+pt(ty(dat,bt.length))+tien(ty(dat,bt.length))+'</td><td class="s">'+dg(dat,bt.length)+'</td></tr>'}
 else r+='<tr><td>Tần suất đăng (≥ 2 bài/tuần)</td><td colspan="3">'+bs("Cập nhật Apps Script 4.11 rồi bấm Đồng bộ ngay để lấy danh sách bài FB/IG.")+'</td></tr>';
 return r+'</table>'}
// 3 nhận định Số liệu → Ý nghĩa → Hành động, sinh từ số đã chốt (có ít nhất 1 mục tiêu chưa đạt)
function nhanDinh(S){var K=S.k,r=[],tt=K.tt,v=tt.video,top=v[0],khac=v.slice(1),tbx=khac.length?khac.reduce(function(s,x){return s+x.xem},0)/khac.length:0;
 r.push(["TikTok "+so(tt.xem)+" / 15.000 lượt xem ("+pt(ty(tt.xem,15000))+")"+(tt.xem<15000?' <span class="chua">Chưa đạt</span>':' <span class="dat">Đạt</span>'),

  "Làm thành chuỗi video quy trình / hậu trường, mở bằng cảnh tay thợ trong 3 giây đầu, đăng đủ 2 video mỗi tuần; đo lại lượt xem sau 2 tuần."]);
 var bt=K.ig.baiTuan;
 if(bt){var dat=bt.filter(function(x){return x>=2}).length,day=[],thua=[];bt.forEach(function(x,i){(x>=2?day:thua).push(K.ig.tuan[i].xem)});

   "Giữ lịch cố định 2 bài/tuần (1 carousel + 1 Reels), dùng lại video TikTok làm Reels để không tốn thêm công sản xuất."])}
 var kn=["fb","ig"].sort(function(a,b){return K[a].er-K[b].er})[0],k=K[kn];

 return r}

  [["Người theo dõi 3 kênh",folTong,KPI.tong,"FB "+so(K.fb.fol)+" · IG "+so(K.ig.fol)+" · TikTok "+so(K.tt.fol)],
