<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>Báo cáo cuối kỳ | Lộc Cộc</title>
<meta name="theme-color" content="#800E13">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23800E13'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* Báo cáo cuối kỳ Truyền thông số: slide HTML lấy số từ chính dashboard quản trị (cùng API, cùng token đăng nhập).
   Số trên slide đọc từ bản "đã chốt" (tab ẩn 📌 Chốt số liệu) để khớp với PDF đã nộp; nút "Số trực tiếp" chỉ để xem trước. */
:root{--be:#E8DCC8;--be-l:#F3EBDD;--be-xl:#FAF6EF;--be-d:#D8C7AA;--red:#800E13;--red-d:#5E0A0E;--nau:#5A3E32;--nau-d:#3E2A21;
 --ink:#2A1C16;--mute:#7E6858;--line:rgba(90,62,50,.2);--tan:#B08A5E;--ok:#2F6B22;--sans:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
body{font:15px/1.5 var(--sans);color:var(--ink);background:#2A1C16;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--red)}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}

/* thanh điều khiển */
.thanh{position:fixed;inset:0 0 auto;z-index:5;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:rgba(42,28,22,.92);color:var(--be);backdrop-filter:blur(8px)}
.thanh b{font-weight:700;margin-right:auto}
.thanh button,.thanh a{border:1px solid rgba(232,220,200,.35);background:transparent;border-radius:999px;padding:7px 14px;color:var(--be);text-decoration:none;font-size:13px}
.thanh button.chinh{background:var(--red);border-color:var(--red)}
.thanh button[aria-pressed=true]{background:var(--be);color:var(--ink)}
.thanh .tt{font-size:12px;opacity:.8}
body.chieu .thanh{opacity:0;pointer-events:none;transition:opacity .3s}
body.chieu .thanh:hover{opacity:1;pointer-events:auto}

/* sân khấu: mỗi slide 1280×720, co giãn theo màn hình */
#san{min-height:100dvh;display:grid;place-items:center;padding:64px 0 20px}
body.chieu #san{padding:0}
.khung{width:calc(1280px*var(--k,1));height:calc(720px*var(--k,1));position:relative}
.sl{position:absolute;inset:0 auto auto 0;width:1280px;height:720px;transform:scale(var(--k,1));transform-origin:0 0;background:var(--be-xl);
 overflow:hidden;display:none;padding:56px 64px 48px;flex-direction:column}
.sl.on{display:flex}
.so-trang{position:absolute;right:64px;bottom:22px;font-size:12px;color:var(--mute);letter-spacing:.08em}
.chan{position:absolute;left:64px;bottom:22px;font-size:12px;color:var(--mute);letter-spacing:.08em}
#dem{position:fixed;right:16px;bottom:12px;color:var(--be);font-size:12px;opacity:.7}

/* chữ */
.phan{font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--red);margin:0 0 10px;display:flex;gap:10px;align-items:center}
.phan i{font-style:normal;background:var(--red);color:var(--be-xl);border-radius:999px;padding:2px 10px;letter-spacing:.06em}
.phan s{text-decoration:none;color:var(--mute);font-weight:600;margin-left:auto;letter-spacing:.08em}
h1{font-size:40px;line-height:1.15;font-weight:800;letter-spacing:-.02em;margin:0 0 22px;color:var(--nau-d);max-width:1100px}
h2{font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--nau);margin:0 0 10px}
p{margin:0 0 10px}
.nho{font-size:12px;color:var(--mute)}
.do{color:var(--red)}
.dat{color:var(--ok);font-weight:700}
.chua{color:var(--red);font-weight:700}

/* bố cục */
.noi{flex:1;display:grid;gap:22px;min-height:0;grid-auto-rows:minmax(0,1fr)}
.noi.tu{grid-auto-rows:auto}
.c2{grid-template-columns:1fr 1fr}.c3{grid-template-columns:repeat(3,1fr)}.c4{grid-template-columns:repeat(4,1fr)}
.c52{grid-template-columns:1.25fr 1fr}
.o{background:#fff;border-radius:18px;padding:20px 22px;box-shadow:0 1px 0 var(--line);min-height:0;display:flex;flex-direction:column}
.o.toi{background:var(--nau-d);color:var(--be)}
.o.toi h2{color:var(--be-d)}
.so{font-size:46px;font-weight:800;letter-spacing:-.03em;line-height:1;color:var(--red)}
.so small{font-size:20px;color:var(--mute);font-weight:600}
.bang{width:100%;border-collapse:collapse;font-size:15px}
.bang th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line)}
.bang td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.bang td.s{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.bang th.s{text-align:right}
.bd{position:relative;flex:1;min-height:0}
.bd canvas{position:absolute;inset:0;width:100%!important;height:100%!important}
.anh{flex:1;min-height:0;border-radius:10px;overflow:hidden;background:var(--be-l)}
.anh img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.the-lk{display:flex;flex-direction:column;gap:6px}

/* chỗ nhóm cần bổ sung */
.bs{border:2px dashed var(--red);border-radius:14px;padding:14px 16px;background:rgba(128,14,19,.05);color:var(--red-d);font-size:14px}
.bs b{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
body.in .bs{display:none}

/* phễu */
.pheu{display:flex;flex-direction:column;gap:12px;align-items:center;flex:1;justify-content:center}
.tang{background:var(--red);color:var(--be-xl);border-radius:16px;padding:16px 24px;display:flex;justify-content:space-between;align-items:baseline;gap:20px}
.tang b{font-size:34px;font-weight:800}
.tang span{font-size:14px;opacity:.85}
.mui{font-size:13px;color:var(--mute);font-weight:600}

/* bìa */
.bia{background:var(--red);color:var(--be);padding:64px}
.bia h1{color:var(--be-xl);font-size:64px;max-width:900px}
.bia .phan{color:var(--be-d)}
.bia .phan i{background:var(--be);color:var(--red)}
.bia .chan,.bia .so-trang{color:var(--be-d)}
.bia .o{background:rgba(250,246,239,.1);color:var(--be);box-shadow:none}
.bia .o h2{color:var(--be-d)}
.bia .so{color:var(--be-xl)}
.bia .so small{color:var(--be-d)}

#loi{position:fixed;inset:0;display:none;place-items:center;background:var(--be);z-index:9;padding:24px;text-align:center}
#loi.on{display:grid}
#loi div{max-width:460px}

@media print{
 @page{size:1280px 720px;margin:0}
 body{background:#fff}
 .thanh,#dem,#loi{display:none!important}
 #san{display:block;padding:0}
 .khung{width:auto;height:auto}
 .sl{display:flex!important;position:relative;transform:none;page-break-after:always;break-after:page}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="thanh">
 <b>Báo cáo cuối kỳ · Lộc Cộc</b>
 <span class="tt" id="tt">Đang tải…</span>
 <button id="n-chot" aria-pressed="true">Số đã chốt</button>
 <button id="n-song" aria-pressed="false">Số trực tiếp</button>
 <button id="n-luu" class="chinh" hidden>Chốt số liệu</button>
 <button id="n-chieu">Trình chiếu</button>
 <button id="n-in">In PDF</button>
 <a href="./">Về dashboard</a>
</div>
<main id="san"><div class="khung" id="khung"></div></main>
<div id="dem"></div>
<div id="loi"><div><h1 style="font-size:28px">Cần đăng nhập quản trị</h1><p id="loi-nd">Mở trang quản trị, đăng nhập, rồi bấm "Báo cáo cuối kỳ" để vào đây.</p><p><a href="./">Đến trang quản trị</a></p></div></div>

<script>
/* Cùng địa chỉ Apps Script với website và trang quản trị. Đổi một chỗ thì đổi cả ba. */
var API="https://script.google.com/macros/s/AKfycbzc2ftUntEyk5PQMaHxldWdDqk0LdH39U8qiY_ZoMe3HiDYQ2vSo_1d4jHRHc7J6VLUCg/exec";
var token="";try{token=sessionStorage.getItem("qt_tk")||""}catch(x){}
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function so(n){return Number(n||0).toLocaleString("vi-VN")}
function pt(n){return (Math.round(n*1000)/10).toLocaleString("vi-VN")+"%"}
function ngay(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function nhan(t){return t.slice(8,10)+"/"+t.slice(5,7)}
function gioVN(iso){var d=new Date(iso);return isNaN(d)?"":d.toLocaleString("vi-VN",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"})}
function cong(t,n){var d=new Date(t+"T00:00:00");d.setDate(d.getDate()+n);return ngay(d)}
function goi(hanh,du){
 return fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({hanh:hanh,token:token},du||{}))})
  .then(function(r){return r.json()}).then(function(j){if(j.hetPhien){$("loi").classList.add("on");throw new Error(j.loi)}if(!j.ok)throw new Error(j.loi||"Có lỗi xảy ra.");return j})}

/* ═════════ Thông tin cố định theo Proposal giữa kỳ (Proposal Final - cap nhat 03-11) ═════════ */
var BAT_DAU="2026-09-26";   // bài đăng đầu tiên "Coming soon" (T1 26/09–02/10 trong Content Calendar)
var NHOM={ten:"Lộc Cộc",lop:"Truyền thông số · 71_DGIM40533 · Lớp 09",gv:"ThS. Nguyễn Ngọc Đăng Khoa",
 tv:["Phạm Quang Hùng (nhóm trưởng)","Lê Quốc Bảo","Nguyễn Diệp Gia Bảo","Nguyễn Thị Huế","Dương Nguyễn Khánh Lam","Ngô Lê Phương Minh",
  "Bùi Ngọc Diễm Phương","Huỳnh Minh Thư","Huỳnh Ngọc Minh Thy","Lưu Thị Hương Trà","Nguyễn Lê Cẩm Tú"]};
var LINK={fb:"facebook.com/loccoc.com.vn",ig:"instagram.com/loccoc.com.vn",tt:"tiktok.com/@loccoc.com.vn",web:"loccoc.com.vn"};
// KPI chung 6A (giữ nguyên theo đề) và mục tiêu riêng 6B (theo slide 20 Proposal)
var KPI={fb:{fol:150,xem:8000,er:.05,bai:2},ig:{fol:120,xem:5000,er:.05,bai:2},tt:{fol:120,xem:15000,er:.05,bai:2},web:120,tong:500};
var MT6B={fbTt:2000,igXem:10000,form:50,formNen:23,tu6B:"2026-10-24"};
// số bài kế hoạch theo tuần T1–T8 (sheet "Tổng quan" của Content Plan - Loc Coc.xlsx) và tỉ lệ trụ nội dung (Proposal slide 9)
var KH={tt:[2,0,3,2,4,4,4,4],ig:[2,0,6,2,3,3,3,3],fb:[0,0,1,2,3,3,3,3]};
var TRU=[["Mộc Kể Chuyện",15],["Ôm Chân Thật",25],["Cân Mọi Outfit",30],["Dấu Ấn Riêng",30]];
var TEN={fb:"Facebook Fanpage",ig:"Instagram",tt:"TikTok",web:"Landing page"};
var NGUON={fb:"Meta Business Suite",ig:"Meta Business Suite",tt:"TikTok Studio + TikTok API",web:"Bộ đếm loccoc.com.vn + Vercel Analytics"};

/* ═════════ Tính số từ dữ liệu dashboard → bản tổng hợp S (đây là thứ được chốt) ═════════ */
function tinh(mx,xem,vc,tq,den){
 var tuan=[];for(var t=BAT_DAU,i=1;t<=den;t=cong(t,7),i++)tuan.push({i:i,tu:t,den:cong(t,6)<den?cong(t,6):den});
 var tong=function(D,f,tu,dn){var s=0;Object.keys(D.ngay||{}).forEach(function(n){if(n>=(tu||BAT_DAU)&&n<=(dn||den))s+=D.ngay[n][f]||0});return s};
 var folNay={fb:(mx.meta.hienTai||{}).fb||0,ig:(mx.meta.hienTai||{}).ig||0,tt:(mx.ttApi.hienTai||{}).fol||0};
 var K={};
 ["fb","ig","tt"].forEach(function(p){var D=mx[p],tt=function(a,b){return p==="tt"?tong(D,"thich",a,b)+tong(D,"bl",a,b)+tong(D,"cs",a,b):tong(D,"tt",a,b)};
  var x=tong(D,"xem"),tu=tt();
  K[p]={fol:folNay[p],xem:x,tuongTac:tu,er:x?tu/x:0,nguoi:tong(D,"nguoi"),clk:tong(D,"clk"),moi:tong(D,"moi"),cs:tong(D,"cs"),hs:tong(D,"hs"),
   tuan:tuan.map(function(w){return {xem:tong(D,"xem",w.tu,w.den),fol:folNay[p]-tong(D,"moi",cong(w.den,1),den)}})}});
 // TikTok: tần suất đăng tính từ danh sách video (API chỉ trả video, không có bài ảnh cuộn)
 var vid=(mx.ttApi.video||[]).filter(function(v){return v.ngay>=BAT_DAU&&v.ngay<=den});
 K.tt.video=vid.map(function(v){var t=v.thich+v.binhLuan+v.chiaSe;return {ten:v.tieuDe,ngay:v.ngay,xem:v.xem,tt:t,er:v.xem?t/v.xem:0,cs:v.chiaSe,link:v.link}}).sort(function(a,b){return b.xem-a.xem});
 K.tt.baiTuan=tuan.map(function(w){return vid.filter(function(v){return v.ngay>=w.tu&&v.ngay<=w.den}).length});
 // FB/IG: danh sách bài từ Graph API (tab ẩn 📝 Bài đăng, Apps Script ≥ 4.11); chưa có thì để null
 var bd=(mx.baiDang||[]).filter(function(b){return b.ngay>=BAT_DAU&&b.ngay<=den});
 ["fb","ig"].forEach(function(p){var ds=bd.filter(function(b){return b.kenh===p});K[p].baiTuan=ds.length?tuan.map(function(w){return ds.filter(function(b){return b.ngay>=w.tu&&b.ngay<=w.den}).length}):null});
 // landing page: phiên có nguồn (mạng xã hội, link giới thiệu, UTM) = truy cập từ bên ngoài; bỏ "Trực tiếp" (gồm lượt của nhóm)
 var ng=xem.nguon||{},ngoai=0;Object.keys(ng).forEach(function(k){if(k!=="Trực tiếp")ngoai+=ng[k]});
 var trongKy=function(r){var n=String(r["Ngày"]||"").slice(0,10);if(!/^\d{4}-\d{2}-\d{2}$/.test(n)){var d=new Date(r["Thời gian"]);n=isNaN(d)?"":ngay(d)}return n};
 var don=(tq.don||[]).map(trongKy).filter(function(n){return n>=BAT_DAU&&n<=den}),lh=(tq.lh||[]).map(trongKy).filter(function(n){return n>=BAT_DAU&&n<=den});
 var form=don.concat(lh);
 var demNgay=function(ds,a,b){return ds.filter(function(n){return n>=a&&n<=b}).length};
 K.web={phien:xem.tong.phien,khach:xem.tong.khach,xem:xem.tong.xem,thoat:xem.tong.thoat,ngoai:ngoai,nguon:ng,vcKhach:vc.tong.khach,vcXem:vc.tong.xem,vcNguon:vc["Nguồn"]||{},
  don:don.length,lh:lh.length,don2Ngay:demNgay(don,"2026-10-18","2026-10-19"),donTruoc23:demNgay(don,BAT_DAU,"2026-10-22"),donSau23:demNgay(don,"2026-10-23",den),form:form.length,form6B:form.filter(function(n){return n>=MT6B.tu6B}).length,
  tuan:tuan.map(function(w){var p=0;Object.keys(xem.ngay||{}).forEach(function(n){if(n>=w.tu&&n<=w.den)p+=xem.ngay[n].phien});
   return {phien:p,form:form.filter(function(n){return n>=w.tu&&n<=w.den}).length}})};
 K.fb.tt6B=(function(){var s=0;Object.keys(mx.fb.ngay).forEach(function(n){if(n>=MT6B.tu6B&&n<=den)s+=mx.fb.ngay[n].tt||0});return s})();
 K.ig.xem6B=(function(){var s=0;Object.keys(mx.ig.ngay).forEach(function(n){if(n>=MT6B.tu6B&&n<=den)s+=mx.ig.ngay[n].xem||0});return s})();
 return {luc:new Date().toISOString(),tu:BAT_DAU,den:den,tuan:tuan,k:K,qc:mx.qcIg||[],
  nguonTT:"TikTok API + TikTok Studio",capNhat:{meta:mx.meta.luc,tt:mx.ttApi.luc,vc:vc.capNhat}};
}
function taiSong(){var den=ngay(new Date()),k={tu:BAT_DAU,den:den};
 return Promise.all([goi("mangXaHoi",k),goi("luotXem",k),goi("vercel",k),goi("tongQuan")]).then(function(r){return tinh(r[0],r[1],r[2],r[3],den)})}

/* ═════════ Vẽ slide từ S ═════════ */
var BIEU=[];
function ty(a,b){return b?a/b:0}
function dg(a,b){return a>=b?'<span class="dat">Đạt</span>':'<span class="chua">Chưa đạt</span>'}
function kq(a,b,kieu){return kieu==="pt"?pt(a)+" / "+pt(b):so(a)+" / "+so(b)}
function bs(t){return '<div class="bs"><b>Cần nhóm bổ sung</b>'+t+'</div>'}
function dong(ten,a,b,kieu,nguon){return '<tr><td>'+ten+'</td><td class="s">'+kq(a,b,kieu)+'</td><td class="s">'+(kieu==="pt"?pt(ty(a,b)).replace("%","")+"%":pt(ty(a,b)))+'</td><td class="s">'+dg(a,b)+'</td><td class="nho">'+nguon+'</td></tr>'}
function bangKpi(p,S){var K=S.k[p],m=KPI[p],r='<table class="bang"><tr><th>Chỉ số bắt buộc</th><th class="s">Kết quả / mục tiêu</th><th class="s">% đạt</th><th class="s"></th><th>Nguồn · khoảng ngày</th></tr>';
 var kh=nhan(S.tu)+"–"+nhan(S.den);
 r+=dong("Người theo dõi (0 → "+so(K.fol)+")",K.fol,m.fol,"",NGUON[p]+" · "+kh);
 r+=dong("Lượt xem (Views)",K.xem,m.xem,"",NGUON[p]+" · "+kh);
 r+=dong("Tương tác ÷ lượt xem",K.er,m.er,"pt","("+so(K.tuongTac)+" ÷ "+so(K.xem)+")");
 var bt=K.baiTuan;
 if(bt){var dat=bt.filter(function(x){return x>=m.bai}).length;r+='<tr><td>Tần suất đăng (≥ 2 '+(p==="tt"?"video":"bài")+'/tuần)</td><td class="s">'+dat+' / '+bt.length+' tuần</td><td class="s">'+pt(ty(dat,bt.length))+'</td><td class="s">'+dg(dat,bt.length)+'</td><td class="nho">'+(p==="tt"?"Danh sách video TikTok API":"Danh sách bài Meta Graph API")+' · '+bt.join("-")+'</td></tr>'}
 else r+='<tr><td>Tần suất đăng (≥ 2 bài/tuần)</td><td colspan="4">'+bs("Cập nhật Apps Script 4.11 rồi bấm Đồng bộ ngay để lấy danh sách bài FB/IG.")+'</td></tr>';
 return r+'</table>'}
function slide(o){return '<section class="sl'+(o.lop?" "+o.lop:"")+'" data-ten="'+esc(o.ten||"")+'"><p class="phan"><i>'+o.so+'</i>'+o.phan+(o.clo?'<s>'+o.clo+'</s>':"")+'</p><h1>'+o.tieuDe+'</h1><div class="noi '+(o.cot||"")+'">'+o.noi+'</div><span class="chan">Lộc Cộc · Báo cáo cuối kỳ Truyền thông số HK261</span><span class="so-trang"></span></section>'}

function ve(S){
 var K=S.k,folTong=K.fb.fol+K.ig.fol+K.tt.fol,xemTong=K.fb.xem+K.ig.xem+K.tt.xem,kh=nhan(S.tu)+"/"+S.tu.slice(0,4)+" – "+nhan(S.den)+"/"+S.den.slice(0,4);
 var W=K.web,H=[];
