<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>Quản trị | Lộc Cộc</title>
<meta name="theme-color" content="#800E13">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23800E13'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* Trang quản trị Lộc Cộc: đường dẫn riêng, không gắn link ở đâu trên web. Bảo vệ thật sự là đăng nhập
   (Apps Script kiểm tra mật khẩu + token phiên); trang này không chứa dữ liệu hay mật khẩu nào. */
:root{--be:#E8DCC8;--be-l:#F3EBDD;--be-xl:#FAF6EF;--be-d:#D8C7AA;--red:#800E13;--red-d:#5E0A0E;--nau:#5A3E32;--nau-d:#3E2A21;
 --ink:#2A1C16;--mute:#8A7565;--line:rgba(90,62,50,.18);--tan:#B08A5E;--ok:#2F6B22;--sans:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
body{font:15px/1.5 var(--sans);color:var(--ink);background:var(--be);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--red)}
.an{display:none!important}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}

/* đăng nhập */
#dn{min-height:100dvh;display:grid;place-items:center;padding:24px}
.dnk{width:100%;max-width:400px;background:var(--be-xl);border-radius:24px;overflow:hidden;box-shadow:0 40px 80px -40px rgba(62,42,33,.55)}
.dnk header{background:var(--red);padding:30px 32px 26px;color:var(--be-l)}
.dnk header img{width:150px;display:block}
.dnk header p{margin:12px 0 0;font-size:12px;letter-spacing:.2em;text-transform:uppercase;opacity:.85}
.dnk form{padding:28px 32px 32px;display:grid;gap:16px}
label.f{display:grid;gap:6px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--nau)}
.in,select.in,textarea.in{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:15px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink)}
.in:focus{outline:2px solid var(--red);outline-offset:0;border-color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border:0;border-radius:999px;background:var(--red);color:var(--be-l);font-weight:700;font-size:13px;letter-spacing:.06em;cursor:pointer;transition:background .2s,transform .15s}
.btn:hover{background:var(--red-d)}.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5;cursor:wait}
.btn.ph{background:transparent;color:var(--red);box-shadow:inset 0 0 0 1.5px var(--red)}
.btn.ph:hover{background:var(--red);color:var(--be-l)}
.btn.nh{padding:7px 14px;font-size:12px}
.btn.xoa{background:transparent;color:var(--red);padding:7px 10px}
.loi{color:var(--red);font-size:14px;min-height:1.2em;margin:0}

/* khung */
#app{display:grid;grid-template-columns:240px 1fr;min-height:100dvh}
aside.sb{background:var(--nau-d);color:var(--be-l);padding:26px 18px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100dvh}
aside.sb img{width:120px;margin:0 10px 26px}
.sb button{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:0;border-radius:12px;background:transparent;color:inherit;text-align:left;font-weight:600;cursor:pointer;opacity:.78}
.sb button:hover{background:rgba(243,235,221,.08);opacity:1}
.sb button[aria-current=page]{background:var(--red);opacity:1}
.sb .du{margin-top:auto;font-size:12px;opacity:.7;padding:0 14px}
main{padding:34px clamp(18px,3vw,44px) 80px;min-width:0}
.dau{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:26px}
.dau h1{font-size:clamp(28px,3vw,40px);letter-spacing:-.04em;line-height:1.05;margin:0}
.dau p{margin:6px 0 0;color:var(--mute);font-size:14px}
.cong{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* chọn khoảng ngày */
.kh{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--be-xl);padding:6px;border-radius:999px}
.kh button{border:0;background:transparent;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--nau);cursor:pointer}
.kh button[aria-pressed=true]{background:var(--red);color:var(--be-l)}
.kh input{border:0;background:transparent;padding:6px 4px;font-size:13px;color:var(--nau);width:130px}

/* thẻ (kéo thả sắp xếp, ẩn/hiện) */
.the-luoi{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px}
.the{grid-column:span 12;background:var(--be-xl);border-radius:20px;padding:22px 24px;position:relative;min-width:0;box-shadow:0 1px 0 rgba(90,62,50,.06)}
.the.w3{grid-column:span 3}.the.w4{grid-column:span 4}.the.w6{grid-column:span 6}.the.w8{grid-column:span 8}
.the h2{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--nau);margin:0 0 14px}
.the .so{font-size:34px;font-weight:800;letter-spacing:-.04em;line-height:1.05;color:var(--ink);font-variant-numeric:tabular-nums}
.the .ph{font-size:13px;color:var(--mute);margin-top:6px}
.tang{color:var(--ok);font-weight:700}.giam{color:var(--red);font-weight:700}
.bd{position:relative;height:280px}
.bd.cao{height:320px}
.sua .the{outline:2px dashed var(--tan);outline-offset:-2px;cursor:grab}
.sua .the.an-the{display:block!important;opacity:.4}
.the .tc{display:none;position:absolute;top:12px;right:12px;gap:6px;z-index:2}
.sua .the .tc{display:flex}
.tc label{display:flex;gap:6px;align-items:center;font-size:12px;font-weight:600;background:#fff;padding:5px 10px;border-radius:999px;cursor:pointer}
.the.keo{opacity:.3}
.an-the{display:none}

/* bảng */
.bg{width:100%;border-collapse:collapse;font-size:14px}
.bg th{text-align:left;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.bg td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top}
.bg tr:last-child td{border-bottom:0}
.bg .ma{font-weight:700;color:var(--red);white-space:nowrap}
.bg .mo{color:var(--mute);font-size:12.5px}
.bg .so-p{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.bc{overflow-x:auto}
.bg textarea{min-height:40px;resize:vertical;font-size:13px;padding:8px 10px}
.bg select{font-size:13px;padding:7px 10px}
.nh-tt{display:inline-block;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap;background:var(--be-l);color:var(--nau)}
.nh-tt.xb{background:#DCE8D2;color:var(--ok)}.nh-tt.hg{background:#F1E3C8;color:#7A5418}.nh-tt.loi{background:#F6E1DE;color:var(--red)}
.tabs{display:flex;gap:6px;margin-bottom:16px}
.tabs button{border:0;background:var(--be-xl);padding:10px 18px;border-radius:999px;font-weight:700;font-size:13px;color:var(--nau);cursor:pointer}
.tabs button[aria-selected=true]{background:var(--nau-d);color:var(--be-l)}
.thanh{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.thanh .in{max-width:320px}
.thanh select.in{max-width:200px}
.trong{color:var(--mute);text-align:center;padding:30px 0}

/* soạn bài */
.sb2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:22px;align-items:start}
.sb2>.the{grid-column:auto}
.form-bai{display:grid;gap:16px}
.hai{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cong-cu{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.cong-cu button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;font-size:13px;font-weight:700;cursor:pointer;color:var(--nau)}
textarea#nd{min-height:380px;font:14.5px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace}
.goi-y{font-size:12.5px;color:var(--mute);text-transform:none;letter-spacing:0;font-weight:400}
.xem-truoc{position:sticky;top:20px;max-height:calc(100dvh - 40px);overflow:auto}
.xt{font-size:16px;line-height:1.7;color:var(--nau)}
.xt h1{font-size:30px;line-height:1.1;letter-spacing:-.04em;color:var(--ink);margin:0 0 10px}
.xt h3{font-size:22px;color:var(--ink);margin:26px 0 10px}.xt h4{font-size:18px;color:var(--ink);margin:20px 0 8px}
.xt blockquote{margin:20px 0;padding:4px 0 4px 18px;border-left:3px solid var(--red);font-style:italic}
.xt img{max-width:100%;border-radius:12px}
.xt .bia{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:14px;margin:12px 0 20px}
.rd{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink)}
.rd label{display:flex;gap:6px;align-items:center;cursor:pointer}

#tb{position:fixed;left:50%;bottom:26px;translate:-50% 0;background:var(--ink);color:var(--be-l);padding:12px 20px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s;z-index:9}
#tb.on{opacity:1}
.dang-tai{color:var(--mute);padding:40px 0;text-align:center}

@media (max-width:1100px){.the.w3{grid-column:span 6}.the.w4,.the.w6,.the.w8{grid-column:span 12}.sb2{grid-template-columns:1fr}.xem-truoc{position:static;max-height:none}}
@media (max-width:760px){
 #app{grid-template-columns:1fr}
 aside.sb{position:sticky;top:0;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px;z-index:5;gap:4px}
 aside.sb img{width:84px;margin:0 8px 0 4px}
 .sb button{width:auto;padding:9px 12px;font-size:13px}
 .sb .du{display:none}
 .the.w3{grid-column:span 6}.the{padding:18px}.the .so{font-size:26px}
 .hai{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="dn">
 <div class="dnk">
  <header><img src="/img/email/logo-trang.png" alt="Lộc Cộc"><p>Khu vực quản trị</p></header>
  <form id="fdn" autocomplete="on">
   <label class="f">Tên đăng nhập<input class="in" id="dn-ten" name="username" autocomplete="username" required></label>
   <label class="f">Mật khẩu<input class="in" id="dn-mk" name="password" type="password" autocomplete="current-password" required></label>
   <p class="loi" id="dn-loi" role="alert"></p>
   <button class="btn" type="submit" id="dn-nut">Đăng nhập</button>
  </form>
 </div>
</div>

<div id="app" class="an">
 <aside class="sb" aria-label="Điều hướng quản trị">
  <img src="/img/email/logo-trang.png" alt="Lộc Cộc">
  <button type="button" data-v="ban">Tổng quan bán hàng</button>
  <button type="button" data-v="don">Đơn hàng &amp; liên hệ</button>
  <button type="button" data-v="bai">Bài viết</button>
  <button type="button" data-v="xem">Lượt truy cập</button>
  <p class="du" id="du-ten"></p>
  <button type="button" id="dx">Đăng xuất</button>
 </aside>
 <main id="vung" tabindex="-1"></main>
</div>
<div id="tb" role="status" aria-live="polite"></div>

<script>
/* Cùng địa chỉ Apps Script với website (var SHEET_URL trong index.html). Đổi một chỗ thì đổi cả hai. */
var API="https://script.google.com/macros/s/AKfycbzc2ftUntEyk5PQMaHxldWdDqk0LdH39U8qiY_ZoMe3HiDYQ2vSo_1d4jHRHc7J6VLUCg/exec";
var MAU=["#800E13","#5A3E32","#B08A5E","#D8C7AA","#9A1A20","#3E2A21","#C9A27E","#7A5C4E","#E3D6C1","#5E0A0E"];
var token="",V="ban",DL=null,BAI=null,BIEU={};

function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function so(n){return Number(n||0).toLocaleString("vi-VN")}
function tien(n){return so(n)+"đ"}
function pt(n){return (Math.round(n*1000)/10).toLocaleString("vi-VN")+"%"}
function tb(m){var t=$("tb");t.textContent=m;t.classList.add("on");clearTimeout(tb.t);tb.t=setTimeout(function(){t.classList.remove("on")},2600)}
function ngay(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function ngayCua(iso){var d=new Date(iso);return isNaN(d)?"":ngay(d)}
function gioVN(iso){var d=new Date(iso);return isNaN(d)?"":d.toLocaleString("vi-VN",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"})}
function nhan(t){var d=new Date(t+"T00:00:00");return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")}

function goi(hanh,du){
 return fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({hanh:hanh,token:token},du||{}))})
  .then(function(r){return r.json()}).then(function(j){if(j.hetPhien){thoat();throw new Error(j.loi)}if(!j.ok)throw new Error(j.loi||"Có lỗi xảy ra.");return j})}

/* ---------- đăng nhập ---------- */
$("fdn").addEventListener("submit",function(e){e.preventDefault();var n=$("dn-nut");n.disabled=true;n.textContent="Đang kiểm tra…";$("dn-loi").textContent="";
 goi("dangNhap",{ten:$("dn-ten").value,matKhau:$("dn-mk").value}).then(function(j){token=j.token;try{sessionStorage.setItem("qt_tk",token);sessionStorage.setItem("qt_ten",j.ten)}catch(x){}$("dn-mk").value="";vao(j.ten)})
 .catch(function(er){$("dn-loi").textContent=er.message||"Không kết nối được máy chủ."}).finally(function(){n.disabled=false;n.textContent="Đăng nhập"})});
function vao(ten){$("dn").classList.add("an");$("app").classList.remove("an");$("du-ten").textContent="Đang đăng nhập: "+ten;mo(location.hash.slice(1)||"ban")}
function thoat(){token="";DL=null;BAI=null;try{sessionStorage.removeItem("qt_tk")}catch(x){}$("app").classList.add("an");$("dn").classList.remove("an");$("dn-ten").focus()}
$("dx").onclick=function(){goi("dangXuat").catch(function(){});thoat()};
document.querySelectorAll(".sb [data-v]").forEach(function(b){b.onclick=function(){mo(b.dataset.v)}});
addEventListener("hashchange",function(){if(token)mo(location.hash.slice(1))});

function mo(v){
 if(["ban","don","bai","xem"].indexOf(v)<0)v="ban";V=v;if(location.hash.slice(1)!==v)history.replaceState(null,"","#"+v);
 document.querySelectorAll(".sb [data-v]").forEach(function(b){b.toggleAttribute("aria-current",b.dataset.v===v);if(b.dataset.v===v)b.setAttribute("aria-current","page")});
 Object.keys(BIEU).forEach(function(k){BIEU[k].destroy()});BIEU={};
 ({ban:vBan,don:vDon,bai:vBai,xem:vXem})[v]();$("vung").focus({preventScroll:true});scrollTo(0,0)}

/* ---------- chọn khoảng ngày ---------- */
var KH={};
function chonKhoang(id,mac,doi){
 var k=KH[id]||(KH[id]={n:mac});
 var h='<div class="kh" role="group" aria-label="Khoảng thời gian">'+[[7,"7 ngày"],[30,"30 ngày"],[90,"90 ngày"],[0,"Tất cả"]].map(function(x){return '<button type="button" data-n="'+x[0]+'" aria-pressed="'+(k.n===x[0])+'">'+x[1]+'</button>'}).join("")+
  '<input type="date" aria-label="Từ ngày" data-tu value="'+(k.tu||"")+'"><span aria-hidden="true">–</span><input type="date" aria-label="Đến ngày" data-den value="'+(k.den||"")+'"></div>';
 setTimeout(function(){var g=document.querySelector("#"+id+" .kh");if(!g)return;
  g.querySelectorAll("button").forEach(function(b){b.onclick=function(){k.n=+b.dataset.n;k.tu=k.den="";doi()}});
  g.querySelectorAll("input").forEach(function(i){i.onchange=function(){var tu=g.querySelector("[data-tu]").value,den=g.querySelector("[data-den]").value;if(tu&&den&&tu<=den){k.n=-1;k.tu=tu;k.den=den;doi()}}})});
 return h}
function khoang(id){var k=KH[id],hn=new Date();
 if(k.n===-1)return {tu:k.tu,den:k.den};
 if(k.n===0)return {tu:"",den:ngay(hn)};
 var t=new Date();t.setDate(t.getDate()-k.n+1);return {tu:ngay(t),den:ngay(hn)}}
function cacNgay(tu,den){var r=[],d=new Date(tu+"T00:00:00"),e=new Date(den+"T00:00:00");while(d<=e&&r.length<1500){r.push(ngay(d));d.setDate(d.getDate()+1)}return r}

/* ---------- thẻ: ẩn/hiện + kéo thả, lưu ở trình duyệt ---------- */
function boCuc(view,luoi){
 var key="qt_bc_"+view,bc={};try{bc=JSON.parse(localStorage.getItem(key)||"{}")}catch(x){}
 var cards=[].slice.call(luoi.children);
 (bc.thuTu||[]).forEach(function(k){var c=luoi.querySelector('[data-k="'+k+'"]');if(c)luoi.appendChild(c)});
 cards.forEach(function(c){c.classList.toggle("an-the",(bc.an||[]).indexOf(c.dataset.k)>-1);
  var tc=document.createElement("div");tc.className="tc";tc.innerHTML='<label><input type="checkbox"'+((bc.an||[]).indexOf(c.dataset.k)>-1?"":" checked")+'> Hiện</label>';c.appendChild(tc);
  tc.querySelector("input").onchange=function(e){c.classList.toggle("an-the",!e.target.checked);luu()}});
 var keo=null;
 luoi.addEventListener("dragstart",function(e){if(!luoi.classList.contains("sua"))return e.preventDefault();keo=e.target.closest(".the");keo.classList.add("keo");e.dataTransfer.effectAllowed="move"});
 luoi.addEventListener("dragover",function(e){if(!keo)return;e.preventDefault();var t=e.target.closest(".the");if(!t||t===keo)return;
  var r=t.getBoundingClientRect(),sau=(e.clientY-r.top)/r.height>.5||(e.clientX-r.left)/r.width>.5;luoi.insertBefore(keo,sau?t.nextSibling:t)});
 luoi.addEventListener("dragend",function(){if(keo)keo.classList.remove("keo");keo=null;luu()});
 function luu(){var b={thuTu:[].map.call(luoi.children,function(c){return c.dataset.k}),an:[].filter.call(luoi.children,function(c){return c.classList.contains("an-the")}).map(function(c){return c.dataset.k})};
  try{localStorage.setItem(key,JSON.stringify(b))}catch(x){}}
 return {bat:function(on){luoi.classList.toggle("sua",on);[].forEach.call(luoi.children,function(c){c.draggable=on})},
  datLai:function(){try{localStorage.removeItem(key)}catch(x){}mo(V)}}}
function nutBoCuc(bc){
 var n=document.querySelector("[data-bc]"),r=document.querySelector("[data-bcl]"),on=false;
 n.onclick=function(){on=!on;bc.bat(on);n.textContent=on?"Xong":"Tuỳ chỉnh bố cục";r.classList.toggle("an",!on);n.classList.toggle("ph",!on)};
 r.onclick=function(){bc.datLai()}}
var NUT_BC='<button class="btn ph nh" type="button" data-bc>Tuỳ chỉnh bố cục</button><button class="btn xoa nh an" type="button" data-bcl>Đặt lại</button>';

/* ---------- biểu đồ ---------- */
Chart.defaults.font.family='"Plus Jakarta Sans",system-ui,sans-serif';Chart.defaults.color="#8A7565";Chart.defaults.borderColor="rgba(90,62,50,.1)";
function ve(id,cfg){var c=$(id);if(!c)return;if(BIEU[id])BIEU[id].destroy();
 cfg.options=Object.assign({responsive:true,maintainAspectRatio:false,interaction:{mode:"index",intersect:false},plugins:{legend:{position:"top",align:"end",labels:{boxWidth:10,boxHeight:10,usePointStyle:true}}}},cfg.options||{});
 BIEU[id]=new Chart(c,cfg)}
function duong(nhanX,ds){return {type:"line",data:{labels:nhanX,datasets:ds.map(function(d,i){return {label:d[0],data:d[1],borderColor:MAU[i],backgroundColor:MAU[i]+"22",fill:i===0,tension:.35,pointRadius:nhanX.length>45?0:3,borderWidth:2.5,yAxisID:d[2]||"y"}})},
 options:{scales:{y:{beginAtZero:true,ticks:{precision:0}},x:{grid:{display:false},ticks:{maxTicksLimit:10}}}}}}
