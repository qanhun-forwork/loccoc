<body>
<svg id="stage" xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080"></svg>
<script>
// ---------------------------------------------------------------------------
// Inputs (all defaults)
// ---------------------------------------------------------------------------
const BRAND = 'Canva';
const PROMPT = 'Design a launch poster for my new app';
const ANSWER = {
  crumb: 'Guides  ›  Get started',
  title: '2.1 Choose a template',
  body: 'Start from a layout built for your idea. Swap in your photos and words, make it yours in one click, and share it anywhere. Every change stays on brand.',
  key: 'in one click'
};
const CARDS = [{title: 'Design', pill: 'Template', art: 1}, {title: 'Present', pill: 'Presentation', art: 2}];
const P = {page: '#FDFDFB', haze: '#B7CFEB', ice: '#E6F0FA', deep: '#294376', sky: '#769CC2', navy: '#1E2F52',
  teal: '#00C4CC', blue: '#2F6BFF', cyan: '#3CC8F0', mint: '#4ED6A0', white: '#FFFFFF'};

// ---------------------------------------------------------------------------
// Math: everything is a continuous function of the frame number
// ---------------------------------------------------------------------------
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const E = {
  lin: t => t,
  in2: t => t * t, in3: t => t * t * t,
  out2: t => 1 - (1 - t) * (1 - t), out3: t => 1 - Math.pow(1 - t, 3),
  inOut: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  sine: t => .5 - .5 * Math.cos(Math.PI * t),
  outExpo: t => t >= 1 ? 1 : (1 - Math.pow(2, -10 * t)) / (1 - Math.pow(2, -10))
};
// keyframe table: [[frame, value, ease?], ...]; ease on a key applies to the segment ending there
function kf(f, k, ease = E.lin) {
  if (f <= k[0][0]) return k[0][1];
  for (let i = 1; i < k.length; i++) if (f <= k[i][0]) {
    const a = k[i - 1], b = k[i], t = (f - a[0]) / (b[0] - a[0]);
    return lerp(a[1], b[1], (b[2] || ease)(t));
  }
  return k[k.length - 1][1];
}
// per-frame lookup table with linear interpolation
function lut(f, f0, arr) {
  const x = clamp(f - f0, 0, arr.length - 1), i = Math.min(arr.length - 2, Math.trunc(x));
  return lerp(arr[i], arr[i + 1], x - i);
}
// monotone cubic (Fritsch-Carlson) through keys, linear extrapolation outside
function mspline(keys) {
  const n = keys.length, xs = keys.map(k => k[0]), ys = keys.map(k => k[1]), d = [], m = [];
  for (let i = 0; i < n - 1; i++) d[i] = (ys[i + 1] - ys[i]) / (xs[i + 1] - xs[i]);
  m[0] = d[0]; m[n - 1] = d[n - 2];
  for (let i = 1; i < n - 1; i++) {
    if (d[i - 1] * d[i] <= 0) m[i] = 0;
    else {
      const h0 = xs[i] - xs[i - 1], h1 = xs[i + 1] - xs[i], w1 = 2 * h1 + h0, w2 = h1 + 2 * h0;
      m[i] = (w1 + w2) / (w1 / d[i - 1] + w2 / d[i]);
    }
  }
  return f => {
    if (f <= xs[0]) return ys[0] + m[0] * (f - xs[0]);
    if (f >= xs[n - 1]) return ys[n - 1] + m[n - 1] * (f - xs[n - 1]);
    let i = 0; while (f > xs[i + 1]) i++;
    const h = xs[i + 1] - xs[i], t = (f - xs[i]) / h, t2 = t * t, t3 = t2 * t;
    return (2 * t3 - 3 * t2 + 1) * ys[i] + (t3 - 2 * t2 + t) * h * m[i] + (-2 * t3 + 3 * t2) * ys[i + 1] + (t3 - t2) * h * m[i + 1];
  };
}
const vel = (fn, f) => (fn(f + .25) - fn(f - .25)) / .5;
function hash(n) { let x = (n | 0) * 374761393 + 668265263; x = (x ^ (x >>> 13)) * 1274126177; x ^= x >>> 16; return ((x >>> 0) % 100000) / 100000; }
const hx = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
function mix(a, b, t) { const A = hx(a), B = hx(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], t))).join(',')})`; }
const n2 = v => (+v).toFixed(2);

// ---------------------------------------------------------------------------
// Per-frame defs (filters, gradients, clips)
// ---------------------------------------------------------------------------
let D = [], uid = 0;
const nid = p => p + (uid++);
const REG = 'filterUnits="userSpaceOnUse" x="-900" y="-900" width="2880" height="2880" color-interpolation-filters="sRGB"';
function fx(sx, sy = sx) {
  sx = Math.max(0, sx); sy = Math.max(0, sy);
  if (sx < .05 && sy < .05) return '';
  const i = nid('f');
  D.push(`<filter id="${i}" ${REG}><feGaussianBlur stdDeviation="${n2(sx)} ${n2(sy)}"/></filter>`);
  return `filter="url(#${i})"`;
}
function glassF(b, slope = .55, icpt = .42) {
  const i = nid('g');
  const fn = c => `<feFunc${c} type="linear" slope="${slope}" intercept="${icpt}"/>`;
  D.push(`<filter id="${i}" ${REG}><feGaussianBlur stdDeviation="${n2(b)}"/><feComponentTransfer>${fn('R')}${fn('G')}${fn('B')}</feComponentTransfer></filter>`);
  return `filter="url(#${i})"`;
}
function glassBlueF(b) {
  const i = nid('g');
  D.push(`<filter id="${i}" ${REG}><feGaussianBlur stdDeviation="${n2(b)}"/><feComponentTransfer><feFuncR type="linear" slope=".55" intercept=".3"/><feFuncG type="linear" slope=".55" intercept=".38"/><feFuncB type="linear" slope=".5" intercept=".5"/></feComponentTransfer></filter>`);
  return `filter="url(#${i})"`;
}
function shadowF(dy, b, col, op) {
  const i = nid('s');
  D.push(`<filter id="${i}" ${REG}><feDropShadow dx="0" dy="${n2(dy)}" stdDeviation="${n2(b)}" flood-color="${col}" flood-opacity="${op}"/></filter>`);
  return `filter="url(#${i})"`;
}
function lin(stops, x1 = 0, y1 = 0, x2 = 0, y2 = 1, user = false) {
  const i = nid('l');
  D.push(`<linearGradient id="${i}" ${user ? 'gradientUnits="userSpaceOnUse"' : ''} x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}">${stops.map(s => `<stop offset="${s[0]}" stop-color="${s[1]}" stop-opacity="${s[2] ?? 1}"/>`).join('')}</linearGradient>`);
  return `url(#${i})`;
}
function rad(stops, cx, cy, r) {
  const i = nid('r');
  D.push(`<radialGradient id="${i}" gradientUnits="userSpaceOnUse" cx="${n2(cx)}" cy="${n2(cy)}" r="${n2(r)}">${stops.map(s => `<stop offset="${s[0]}" stop-color="${s[1]}" stop-opacity="${s[2] ?? 1}"/>`).join('')}</radialGradient>`);
  return `url(#${i})`;
}
function clip(shape) { const i = nid('c'); D.push(`<clipPath id="${i}">${shape}</clipPath>`); return `clip-path="url(#${i})"`; }
const rr = (x, y, w, h, r) => `<rect x="${n2(x)}" y="${n2(y)}" width="${n2(w)}" height="${n2(h)}" rx="${n2(Math.min(r, w / 2, h / 2))}"/>`;
// blur along an arbitrary direction: rotate into the motion frame, blur x, rotate back
function dirBlur(content, ang, amt, cx, cy, round = 0) {
  if (amt < .05 && round < .05) return content;
  const a = n2(ang);
  return `<g transform="rotate(${a} ${n2(cx)} ${n2(cy)})" ${fx(amt + round, round)}><g transform="rotate(${-a} ${n2(cx)} ${n2(cy)})">${content}</g></g>`;
}
function motionBlur(content, vx, vy, k, cap, cx, cy, round = 0) {
  const sp = Math.hypot(vx, vy);
  return dirBlur(content, Math.atan2(vy, vx) * 180 / Math.PI, Math.min(cap, sp * k), cx, cy, round);
}
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
const T = (x, y, s, sz, wt, fill, extra = '') => `<text x="${n2(x)}" y="${n2(y)}" font-size="${n2(sz)}" font-weight="${wt}" fill="${fill}" ${extra}>${esc(s)}</text>`;

// text measurement (only after fonts load)
const cv = document.createElement('canvas').getContext('2d');
function tw(s, wt, sz) { cv.font = `${wt} ${sz}px IF`; return cv.measureText(s).width; }

// ---------------------------------------------------------------------------
// Shared pieces
// ---------------------------------------------------------------------------
// macOS arrow: tip at origin, black fill, white outline, soft shadow
function cursor(x, y, rot, sc, vx = 0, vy = 0, op = 1) {
  const g = `<g transform="translate(${n2(x)} ${n2(y)}) rotate(${n2(rot)}) scale(${n2(sc * 1.16)}) translate(-1.5 -1.5)" ${shadowF(1.4, 1.5, '#000', .32)}>
    <path d="M1.5 1.5 L1.5 28.6 L8.1 22.4 L12.5 32.9 L17.1 31 L12.8 20.9 L21.7 20.9 Z" fill="#000" stroke="#fff" stroke-width="2.3" stroke-linejoin="round" paint-order="stroke"/></g>`;
  return `<g opacity="${n2(op)}">${motionBlur(g, vx, vy, .22, 7, x, y)}</g>`;
}
// placeholder mark: four corner brackets around a bold C (never a real company's logo)
function mark(cx, cy, s, col) {
  const h = s / 2, L = s * .27, sw = s * .075, a = h - sw / 2;
  const p = [[-1, -1], [1, -1], [1, 1], [-1, 1]].map(([sx, sy]) =>
    `M${n2(cx + sx * a)} ${n2(cy + sy * a - sy * L)} L${n2(cx + sx * a)} ${n2(cy + sy * a)} L${n2(cx + sx * a - sx * L)} ${n2(cy + sy * a)}`).join(' ');
  const fs = s * .64;
  return `<path d="${p}" fill="none" stroke="${col}" stroke-width="${n2(sw)}" stroke-linecap="round" stroke-linejoin="round"/>` +
    T(cx, cy + fs * .364, 'C', fs, 700, col, 'text-anchor="middle"');
}
function star(x, y, s, fill, op = 1) {
  const k = s * .22;
  return `<path d="M${n2(x)} ${n2(y - s)} Q${n2(x + k * .3)} ${n2(y - k * .3)} ${n2(x + s)} ${n2(y)} Q${n2(x + k * .3)} ${n2(y + k * .3)} ${n2(x)} ${n2(y + s)} Q${n2(x - k * .3)} ${n2(y + k * .3)} ${n2(x - s)} ${n2(y)} Q${n2(x - k * .3)} ${n2(y - k * .3)} ${n2(x)} ${n2(y - s)} Z" fill="${fill}" opacity="${op}"/>`;
}
// procedural cover art (no text baked in)
function art(x, y, w, h, v) {
  const m = Math.min(w, h);
  const X = u => n2(x + u * w), Y = u => n2(y + u * h);
  let o = '';
  if (v === 0) {
    o += `<rect x="${n2(x)}" y="${n2(y)}" width="${n2(w)}" height="${n2(h)}" fill="${lin([[0, P.blue], [1, P.cyan]])}"/>`;
    o += `<circle cx="${X(.66)}" cy="${Y(.38)}" r="${n2(m * .42)}" fill="#fff" opacity=".14"/>`;
    o += `<circle cx="${X(.66)}" cy="${Y(.38)}" r="${n2(m * .2)}" fill="${rad([[0, '#fff'], [1, P.ice]], x + .62 * w, y + .32 * h, m * .24)}"/>`;
    o += `<path d="M${X(-.05)} ${Y(.74)} C${X(.25)} ${Y(.56)} ${X(.5)} ${Y(.86)} ${X(1.05)} ${Y(.66)} L${X(1.05)} ${Y(1.05)} L${X(-.05)} ${Y(1.05)} Z" fill="${P.mint}"/>`;
    o += `<path d="M${X(-.05)} ${Y(.86)} C${X(.3)} ${Y(.76)} ${X(.6)} ${Y(.98)} ${X(1.05)} ${Y(.82)} L${X(1.05)} ${Y(1.05)} L${X(-.05)} ${Y(1.05)} Z" fill="${P.teal}"/>`;
    o += `<path d="M${X(-.05)} ${Y(.95)} C${X(.35)} ${Y(.9)} ${X(.7)} ${Y(1.0)} ${X(1.05)} ${Y(.93)} L${X(1.05)} ${Y(1.05)} L${X(-.05)} ${Y(1.05)} Z" fill="${P.navy}"/>`;
    for (let i = 0; i < 4; i++) o += star(x + w * (.12 + .22 * hash(i + 3)), y + h * (.12 + .3 * hash(i + 9)), m * (.03 + .03 * hash(i + 21)), '#fff', .9);
  } else if (v === 1) {
    o += `<rect x="${n2(x)}" y="${n2(y)}" width="${n2(w)}" height="${n2(h)}" fill="${lin([[0, P.teal], [1, P.mint]], 0, 0, 1, 1)}"/>`;
    o += `<circle cx="${X(.2)}" cy="${Y(1.0)}" r="${n2(h * .62)}" fill="${P.navy}"/>`;
    o += `<circle cx="${X(.2)}" cy="${Y(1.0)}" r="${n2(h * .42)}" fill="${P.deep}"/>`;
    o += `<circle cx="${X(.78)}" cy="${Y(.32)}" r="${n2(h * .22)}" fill="none" stroke="#fff" stroke-width="${n2(h * .055)}"/>`;
    o += `<rect x="${n2(x + .55 * w - h * .16)}" y="${n2(y + .62 * h - h * .16)}" width="${n2(h * .32)}" height="${n2(h * .32)}" rx="${n2(h * .07)}" fill="${P.blue}" transform="rotate(18 ${X(.55)} ${Y(.62)})"/>`;
    for (let i = 0; i < 5; i++) for (let j = 0; j < 3; j++) o += `<circle cx="${X(.06 + i * .05)}" cy="${Y(.12 + j * .07)}" r="${n2(m * .012)}" fill="#fff" opacity=".8"/>`;
  } else {
    o += `<rect x="${n2(x)}" y="${n2(y)}" width="${n2(w)}" height="${n2(h)}" fill="${lin([[0, P.navy], [1, P.blue]], 0, 0, 1, 1)}"/>`;
    o += `<circle cx="${X(.74)}" cy="${Y(.46)}" r="${n2(h * .34)}" fill="${P.cyan}"/>`;
    o += `<circle cx="${X(.74)}" cy="${Y(.46)}" r="${n2(h * .2)}" fill="${P.ice}" opacity=".9"/>`;
    for (let i = 0; i < 6; i++) o += `<line x1="${X(-.1 + i * .09)}" y1="${Y(1.1)}" x2="${X(.25 + i * .09)}" y2="${Y(-.1)}" stroke="#fff" stroke-width="${n2(m * .012)}" opacity=".22"/>`;
    o += `<rect x="${X(.1)}" y="${Y(.26)}" width="${n2(w * .26)}" height="${n2(h * .13)}" rx="${n2(h * .065)}" fill="${P.mint}"/>`;
    o += star(x + .48 * w, y + .22 * h, m * .05, '#fff', .95);
  }
  return o;
}

// ---------------------------------------------------------------------------
// Layout (computed once, after fonts load)
// ---------------------------------------------------------------------------
const L = {};
function layout() {
  // S1 lockup: disc 132, name, pill; scaled as a whole to span x474-1063
  const d = 132, g1 = 30, g2 = 24, pillFs = 34, pillH = 70, pillW = tw('AI', 600, pillFs) + 56;
  const avail = 589 - d - g1 - g2 - pillW;
  let nameFs = 112 * avail / tw(BRAND, 500, 112), sc = 1;
  if (nameFs > 126) nameFs = 126;
  if (nameFs < 72) { nameFs = 72; sc = 589 / (d + g1 + g2 + pillW + tw(BRAND, 500, 72)); }
  const nameW = tw(BRAND, 500, nameFs);
  Object.assign(L, {d, g1, g2, pillFs, pillH, pillW, nameFs, nameW, sc});

  // S3 prompt wrap
  const words = PROMPT.split(' '), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (tw(t, 500, 40) > 630 && cur) { lines.push(cur + ' '); cur = w; } else cur = t; }
  lines.push(cur); L.promptLines = lines;

  // S4 body wrap with the key phrase kept as one token
  const ki = ANSWER.body.indexOf(ANSWER.key);
  const toks = [];
  ANSWER.body.slice(0, ki).trim().split(' ').forEach(w => toks.push({w, k: 0}));
  toks.push({w: ANSWER.key, k: 1});
  const rest = ANSWER.body.slice(ki + ANSWER.key.length);
  const m = rest.match(/^\S*/)[0];
  if (m) toks[toks.length - 1].tail = m;
  rest.slice(m.length).trim().split(' ').filter(Boolean).forEach(w => toks.push({w, k: 0}));
  const sp = tw(' ', 400, 47), bl = []; let line = [], lw = 0;
  for (const t of toks) {
    const w = tw(t.w, t.k ? 600 : 400, 47) + (t.tail ? tw(t.tail, 400, 47) : 0);
    if (line.length && lw + sp + w > 850) { bl.push(line); line = []; lw = 0; }
    t.x = lw + (line.length ? sp : 0); t.width = w; lw = t.x + w; line.push(t);
  }
  bl.push(line); L.body = bl;
  bl.forEach((ln, i) => ln.forEach(t => { if (t.k) { L.keyLine = i; L.keyX = 120 + t.x; L.keyW = tw(t.w, 600, 47); } }));

  // S6 glass title size, same for both cards
  L.cardFs = Math.min(205, ...CARDS.map(c => 482 / tw(c.title, 700, 100) * 100));
  L.word100 = tw(BRAND, 600, 100);
}

// ---------------------------------------------------------------------------
// S1 f0-71: header + window + click
// ---------------------------------------------------------------------------
const s1y = mspline([[0, 932], [2, 776], [5, 683], [10, 608], [24, 546], [37, 536], [72, 501]]);
const s1cx = mspline([[24, 930], [27, 891], [44, 770], [48, 742], [56, 629], [59, 587], [71, 555], [72, 552]]);
const s1cy = mspline([[24, 396], [27, 393], [44, 383], [48, 410], [56, 564], [59, 546], [71, 531], [72, 530]]);
const s1rot = mspline([[27, -12], [36, -45], [44, -62], [47, -70], [51, -108], [56, -104], [72, -88]]);
function lockup(f) {
  const {d, g1, g2, pillFs, pillH, pillW, nameFs, nameW, sc} = L;
  const x0 = 474, cx = x0 + d / 2, nx = x0 + d + g1, px = nx + nameW + g2;
  const nameOp = f < 2 ? 0 : kf(f, [[2, .35], [4, 1]]);
  const nameBl = kf(f, [[2, 10], [9, 0, E.out2]]);
  const pillOp = f < 4 ? 0 : kf(f, [[4, .5], [5, .85], [7, 1]]);
  const pillBl = kf(f, [[4, 18], [5, 14], [13, 0, E.out2]]);
  const pillDx = kf(f, [[4, 15], [13, 0, E.out3]]);
  const ring = kf(f, [[53, 0], [58, 1, E.out2]]);
  let o = '';
  if (ring > 0) o += `<circle cx="${cx}" cy="0" r="87" fill="${rad([[0, '#D5F3FF'], [.74, '#D5F3FF'], [1, '#F7FEFF']], cx, 0, 87)}" opacity="${n2(ring)}"/>` +
    `<circle cx="${cx}" cy="0" r="${n2(87 + 14 * ring)}" fill="#D5F3FF" opacity="${n2(.25 * ring)}" ${fx(10)}/>`;
  o += `<g ${shadowF(6, 10, P.navy, .1)}><circle cx="${cx}" cy="0" r="${d / 2}" fill="#FBFCFE" stroke="#E8E8EA" stroke-width="1"/></g>`;
  o += mark(cx, 0, d * .5, P.navy);
  if (nameOp > 0) o += `<g opacity="${n2(nameOp)}" ${fx(nameBl)}>${T(nx, nameFs * .364, BRAND, nameFs, 500, '#161618')}</g>`;
  if (pillOp > 0) o += `<g opacity="${n2(pillOp)}" ${fx(pillBl, pillBl * .6)} transform="translate(${n2(pillDx)} 0)">
    <rect x="${n2(px)}" y="${-pillH / 2}" width="${n2(pillW)}" height="${pillH}" rx="${pillH / 2}" fill="#2F2E2F"/>
    ${T(px + pillW / 2, pillFs * .364, 'AI', pillFs, 600, '#fff', 'text-anchor="middle"')}</g>`;
  return `<g transform="translate(${x0} 0) scale(${sc}) translate(${-x0} 0)">${o}</g>`;
}
function homeWindow(f) {
  const op = kf(f, [[14, 0], [15, .53], [19, .7], [24, 1]]);
  if (op <= 0) return '';
  const cl = clip(rr(408, 405, 1200, 1100, 93));
  let o = `<g ${shadowF(18, 30, P.navy, .09)}>${`<rect x="408" y="405" width="1200" height="1100" rx="93" fill="#FCFDFF"/>`}</g>`;
  o += `<g ${cl}>
    <rect x="408" y="405" width="1200" height="80" fill="#F1F6FF"/>
    <rect x="408" y="484" width="1200" height="1" fill="#E3EBF7"/>
    <circle cx="820" cy="1180" r="640" fill="${rad([[0, '#DCEBFC', .95], [.6, '#E6F1FD', .55], [1, '#FCFDFF', 0]], 820, 1180, 640)}"/>
    <rect x="522" y="424" width="640" height="42" rx="21" fill="#fff" stroke="#DFE7F2"/>
    <circle cx="549" cy="443" r="8" fill="none" stroke="#8C9DB5" stroke-width="2.2"/><path d="M555 449 L561 455" stroke="#8C9DB5" stroke-width="2.2" stroke-linecap="round"/>
    ${T(574, 451, 'Search designs, templates and more', 19, 400, '#97A4B6')}
    <rect x="507" y="709" width="60" height="60" rx="18" fill="#E7EFFD"/>
    ${[[0, 0], [1, 0], [0, 1], [1, 1]].map(([i, j]) => `<rect x="${521 + i * 17}" y="${723 + j * 17}" width="14" height="14" rx="4" fill="${P.blue}" opacity="${i + j === 1 ? .55 : 1}"/>`).join('')}
    ${T(537, 797, 'Templates', 17, 500, '#4A5A72', 'text-anchor="middle"')}
    <g opacity=".38"><rect x="507" y="870" width="60" height="60" rx="18" fill="#EEF2F8"/>
    <path d="M520 889 h12 l4 5 h18 v19 h-34 Z" fill="none" stroke="#5E6E86" stroke-width="2.4" stroke-linejoin="round"/>
    ${T(537, 958, 'Projects', 17, 500, '#4A5A72', 'text-anchor="middle"')}</g>
    <g ${shadowF(10, 18, P.navy, .1)}><rect x="764" y="700" width="440" height="470" rx="34" fill="#fff" stroke="#E7ECF4"/></g>
    <g ${clip(rr(780, 716, 408, 262, 22))}>${art(780, 716, 408, 262, 0)}</g>
    ${T(786, 1022, 'Launch poster', 27, 600, '#1A1A1E')}
    ${T(786, 1054, 'Template · 8 pages', 20, 400, '#8A93A3')}
  </g>`;
  return `<g opacity="${n2(op)}">${o}</g>`;

  let d = 168, cy;
  if (f < 269) cy = s7top(f) + 84; else cy = 540;
  if (f > 287) d = 168 - 45 * E.in3(clamp((f - 287) / 13));
  const v = f < 269 ? Math.abs(vel(s7top, f)) : 0;
  const smear = kf(f, [[245, 6], [247, 3], [250, 1], [253, 0]]) + Math.min(4, v * .08);
  const end = kf(f, [[294, 0], [301, 1.6, E.in2]]);
  const disc = `<g ${shadowF(8 * d / 168, 14 * d / 168, P.navy, .1)}><circle cx="540" cy="${n2(cy)}" r="${n2(d / 2)}" fill="#F6F6F6" stroke="#E8E8EA" stroke-width="1"/></g>` + mark(540, cy, d * .5, P.navy);
  o += (smear + end) > .05 ? `<g ${fx(end, smear + end)}>${disc}</g>` : disc;
  return o;
}

// ---------------------------------------------------------------------------
// S8 f301-359: black end card, glowing wordmark
// ---------------------------------------------------------------------------
const s8w = mspline([[301, 1650], [302, 1350], [303, 1110], [304, 1049], [309, 734], [311, 678], [320, 563], [342, 516], [350, 492], [355, 450], [359, 267], [360, 190]]);
function S8(f) {
  let o = `<rect width="1080" height="1080" fill="${rad([[0, '#272729'], [.38, '#161618'], [1, '#020204']], 540, 540, 780)}"/>`;
  const w = Math.max(40, s8w(f)), fs = w / L.word100 * 100, by = 540 + fs * .364;
  const word = (fill, extra = '') => `<text x="540" y="${n2(by)}" font-size="${n2(fs)}" font-weight="600" fill="${fill}" text-anchor="middle" ${extra}>${esc(BRAND)}</text>`;
  const smear = kf(f, [[301, 38], [302, 17], [303, 8], [304, 3.5], [307, 0, E.out2]]);
  const endBl = kf(f, [[354, 0], [359, 3.5, E.in2], [360, 4.2]]);
  let g = '';
  // zoom streaks: scaled, faded copies
  const sf = kf(f, [[301, 1], [303, .45], [306, 0, E.out2]]);
  if (sf > 0) for (let k = 1; k <= 24; k++) {
    const s = 1 + k * .045;
    g += `<g transform="translate(540 540) scale(${n2(s)} ${n2(1 + k * .012)}) translate(-540 -540)" opacity="${n2(.15 * (1 - k / 25) * sf)}">${word('#F3F3F5')}</g>`;
  }
  g += `<g opacity=".34" ${fx(fs * .2)}>${word('#C9D9F2')}</g>`;
  g += `<g opacity=".6" ${fx(Math.max(2, fs * .025))}>${word('#F3F3F5')}</g>`;
  g += word('#F3F3F5');
  o += `<g ${fx(smear + endBl, endBl + smear * .05)}>${g}</g>`;
  return o;
}

// ---------------------------------------------------------------------------
// Shot registry + seek
// ---------------------------------------------------------------------------
const SHOTS = [
  {f0: 0, f1: 71, render: lf => S1(lf)},
  {f0: 72, f1: 100, render: lf => S2(72 + lf)},
  {f0: 101, f1: 158, render: lf => S3(101 + lf)},
  {f0: 159, f1: 186, render: lf => S4(159 + lf)},
  {f0: 187, f1: 214, render: lf => S5(187 + lf)},
  {f0: 215, f1: 244, render: lf => S6(215 + lf)},
  {f0: 245, f1: 300, render: lf => S7(245 + lf)},
  {f0: 301, f1: 359, render: lf => S8(301 + lf)}
];
const stage = document.getElementById('stage');
window.seek = function (f) {
  D = []; uid = 0;
  let s = SHOTS[0];
  for (const sh of SHOTS) if (f >= sh.f0) s = sh;
  const body = s.render(f - s.f0);
  stage.innerHTML = `<defs>${D.join('')}</defs>${body}`;
  return s.f0;
};
window.ready = (async () => {
  await Promise.all([400, 500, 600, 700].map(w => document.fonts.load(`${w} 40px IF`)));
  await document.fonts.ready;
  layout();
  const q = new URLSearchParams(location.search).get('f');
  seek(q ? +q : 40);
  return true;
})();
</script>
